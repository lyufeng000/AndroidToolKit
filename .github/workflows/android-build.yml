name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Prepare Android SDK
        shell: pwsh
        run: |
          $platform = Join-Path $env:ANDROID_HOME 'platforms/android-37.0/android.jar'
          if (-not (Test-Path -LiteralPath $platform -PathType Leaf)) {
            $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
            & $sdkManager --sdk_root=$env:ANDROID_HOME 'platforms;android-37.0'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build debug APK
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'D:\')) {
            $buildDrive = Join-Path $env:RUNNER_TEMP 'android-build-drive'
            New-Item -ItemType Directory -Path $buildDrive -Force | Out-Null
            subst D: $buildDrive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $apkPath = Join-Path $env:RUNNER_TEMP 'AndroidToolKit-debug.apk'
          .\Build.ps1 -ApkPath $apkPath
          exit $LASTEXITCODE

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidToolKit-debug
          path: ${{ runner.temp }}/AndroidToolKit-debug.apk
          if-no-files-found: error
